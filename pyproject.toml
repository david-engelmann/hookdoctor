[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hookdoctor"
version = "0.1.0"
description = "An examination of configured hooks against session execution traces"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
hookdoctor = "hookdoctor.cli:main"

[tool.setuptools.packages.find]
include = ["hookdoctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
